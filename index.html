<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Shower - Gabriel y Diana</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Librería de Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="card-wrapper">
    <div class="card-container">
      
      <!-- Formulario posicionado sobre los campos de la imagen -->
      <form class="rsvp-form" id="rsvpForm">
        
        <div class="input-group">
          <input 
            type="text" 
            id="name" 
            class="custom-input" 
            placeholder="Tu nombre y apellido" 
            required
          >
        </div>

        <div class="input-group">
          <select id="status" class="custom-input custom-select" required>
            <option value="" disabled selected hidden>¿Podrás acompañarnos?</option>
            <option value="¡Sí! Me encantaría acompañarlos en un día tan especial.">¡Sí, ahí estaré!</option>
            <option value="Esta vez no podré ir, pero les mando un abrazo enorme.">No podré ir esta vez</option>
          </select>
        </div>

        <div class="input-group">
          <input
            type="number"
            id="guests"
            class="custom-input"
            min="0"
            step="1"
            placeholder="Cantidad de acompañantes"
            aria-label="Cantidad de acompañantes"
            required
          >
        </div>

        <button type="submit" class="btn-whatsapp">
          <svg class="ws-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
          Confirmar por WhatsApp
        </button>

      </form>

    </div>

    <section class="location-card" aria-labelledby="location-title">
      <h2 id="location-title">¿Cómo llegar?</h2>
      <p>Tomé 1101, Sede Social, Villa Humberto Díaz Casanueva, Puente Alto</p>
      <a
        class="maps-link"
        href="https://www.google.com/maps/dir/?api=1&amp;destination=-33.598951523528456%2C-70.55957086741842"
        target="_blank"
        rel="noopener noreferrer"
      >Abrir en Google Maps</a>
      <iframe
        class="location-map"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1661.622414391978!2d-70.55957086741842!3d-33.598951523528456!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9662d6f6d6e6219d%3A0x6ab7642ae0837505!2sTom%C3%A9%201101%2C%208180181%20Puente%20Alto%2C%20Regi%C3%B3n%20Metropolitana!5e0!3m2!1ses-419!2scl!4v1791775950552!5m2!1ses-419!2scl"
        title="Mapa de la Sede Social de Villa Humberto Díaz Casanueva"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
